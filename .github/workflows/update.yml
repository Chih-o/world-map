name: Update map data

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes
  workflow_dispatch:       # "Run workflow" button on the Actions tab
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest GDELT events
        run: python scripts/fetch_gdelt.py
        continue-on-error: true

      - name: Fetch stock indices
        run: python scripts/fetch_markets.py
        continue-on-error: true

      # latest.json is large and regenerated every run, so only the small
      # files needed by the next run are committed; Pages gets all of them.
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/markets.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
